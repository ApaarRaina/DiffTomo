[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["difftomo*"]

[project]
name = "difftomo"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Differentiable library for tomography"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "torchvision",
    "torch"
]