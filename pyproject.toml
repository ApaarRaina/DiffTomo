[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "difftomo"
version = "0.1.0"
description = "Differentiable library for tomography"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "numpy",
    "scipy",
    "gdown",
    "torch",
    "torchvision"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["difftomo*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
difftomo = [
    "**/*.cpp",
    "**/*.cu",
    "**/*.h",
    "**/*.hpp",
    "**/*.cuh"
]